<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pay Me Page</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow-to-wide column; header card, optional amount picker, then an auto-fill grid of method cards that reflows by count */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e4e8ee; --fg:#141922; --muted:#5b6576;
  --line:#d6dce5; --accent:#2b50e0; --accent-fg:#ffffff; --ok:#14804a;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#171b24; --sunk:#1f2430; --fg:#e9edf4; --muted:#97a1b3;
  --line:#2a3140; --accent:#7d97ff; --accent-fg:#0b1030; --ok:#4fd38d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#171b24; --sunk:#1f2430; --fg:#e9edf4; --muted:#97a1b3;
  --line:#2a3140; --accent:#7d97ff; --accent-fg:#0b1030; --ok:#4fd38d; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-block:clamp(20px,5vw,56px) 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}

/* header */
.who{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.avatar{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font:700 26px/1 var(--display);flex:none}
.who-text{min-width:0;flex:1}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(28px,6vw,40px)/1.05 var(--display);margin:6px 0 4px;letter-spacing:-.01em;text-wrap:balance}
.note{margin:0;color:var(--muted);max-width:60ch}

.setup{background:var(--sunk);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.setup code{font-family:var(--mono);font-size:13px;color:var(--fg)}

/* amount picker */
.amount{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.amount-label{font-weight:600;margin-right:4px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  font:500 15px/1 var(--body);padding:10px 14px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums;min-height:40px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.custom{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;min-height:40px}
.custom span{color:var(--muted)}
.custom input{width:5.5ch;border:0;background:transparent;color:var(--fg);font:500 15px var(--body);padding:8px 2px;outline:none;font-variant-numeric:tabular-nums}
.custom:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.amount-hint{flex-basis:100%;font-size:13px;color:var(--muted);margin:0}

/* grid of methods: reflows automatically as items are added/removed */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px;align-items:stretch;grid-auto-rows:1fr;
  list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;gap:14px;min-width:0}
.top{display:flex;align-items:center;gap:12px;min-width:0}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  font:700 19px/1 var(--display)}
.meta{min-width:0;flex:1}
.name{font:600 16px/1.2 var(--body)}
.handle{font:400 14px/1.35 var(--mono);color:var(--muted);overflow-wrap:anywhere;margin-top:3px;user-select:all}
.actions{display:flex;gap:8px;margin-top:auto}
.btn{appearance:none;flex:1;min-height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--sunk);color:var(--fg);font:600 14px/1 var(--body);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;padding:0 10px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);flex:1.4}
.btn.icon{flex:0 0 44px;padding:0}
.btn:hover{filter:brightness(1.05)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.done{color:var(--ok)}
.btn svg{width:18px;height:18px;flex:none}

.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,#000 45%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(100%,320px);
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sheet-title{font:700 20px/1.2 var(--display)}
.sheet-handle{font:400 13px/1.4 var(--mono);color:var(--muted);overflow-wrap:anywhere;max-width:100%}
.qr-box{background:#fff;padding:12px;border-radius:12px;line-height:0}
.qr-box img,.qr-box canvas{width:200px;height:200px;max-width:100%}
.sheet small{font-size:13px;color:var(--muted)}
.sheet .btn{width:100%;flex:none}

.foot{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--fg);color:var(--bg);font:600 14px var(--body);padding:10px 16px;border-radius:999px;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="wrap">
  <header class="who">
    <div class="avatar" id="avatar"></div>
    <div class="who-text">
      <div class="eyebrow" id="count"></div>
      <h1 id="name"></h1>
      <p class="note" id="note"></p>
    </div>
  </header>

  <p class="setup" id="setup" hidden>These are example handles. Replace them in the <code>METHODS</code> list at the bottom of this page, and set <code>SHOW_SETUP_NOTE</code> to <code>false</code>.</p>

  <section class="amount" id="amount" aria-label="Amount" hidden>
    <span class="amount-label">Amount</span>
    <div id="chips" style="display:contents"></div>
    <label class="custom" for="customAmt"><span>$</span><input id="customAmt" inputmode="decimal" placeholder="Other" aria-label="Custom amount"></label>
    <p class="amount-hint">Fills in the amount on Venmo, Cash App and PayPal. Optional.</p>
  </section>

  <ul class="grid" id="grid"></ul>

  <p class="foot">Double-check the handle before you send. Payments can't be pulled back.</p>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="qr-box" id="qrBox"></div>
    <div class="sheet-handle" id="sheetHandle"></div>
    <small id="sheetHint"></small>
    <button class="btn" type="button" id="sheetClose">Close</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============ EDIT THIS ============ */
const SHOW_SETUP_NOTE = false;

const PROFILE = {
  name: "Chris Tracy",
  initials: "CT",
  note: "Use whichever app is easiest for you. Thank you!",
};

// Amount chips in dollars. Use [] to hide the amount picker.
const AMOUNTS = [5, 10, 20, 50];

// Add, remove or reorder. The grid resizes itself.
// Built-in types: venmo, cashapp, paypal, kofi, zelle, applecash, bitcoin, ethereum, litecoin, solana
// Custom: { label:"Ko-fi", value:"ko-fi.com/you", url:"https://ko-fi.com/you", color:"#29abe0", letter:"K" }
const METHODS = [
  { type: "venmo",    handle: "christracy" },
  //{ type: "cashapp",  handle: "" },
  { type: "paypal",   handle: "cstracy" },
  { type: "kofi",     handle: "ctracy" },
  { type: "bitcoin",  address: "bc1qevdglv9u656apdpg0sqhzhlws4p8qk8n6q7hk7" },
  { type: "ethereum", address: "0x387De24E6A13769170A88A9A2406475c6791b0Aa" },
];
/* =================================== */

const TYPES = {
  venmo:   { label:"Venmo",    letter:"V", color:"#008cff", fg:"#fff", show:m=>"@"+m.handle,
             url:(m,a)=> a ? `https://venmo.com/?txn=pay&recipients=${encodeURIComponent(m.handle)}&amount=${fmt(a)}` : `https://venmo.com/u/${encodeURIComponent(m.handle)}`, amt:true },
  cashapp: { label:"Cash App", letter:"$", color:"#00d64f", fg:"#05210f", show:m=>"$"+m.handle,
             url:(m,a)=> `https://cash.app/$${encodeURIComponent(m.handle)}${a?"/"+fmt(a):""}`, amt:true },
  paypal:  { label:"PayPal",   letter:"P", color:"#0b2f8a", fg:"#fff", show:m=>"paypal.me/"+m.handle,
             url:(m,a)=> `https://paypal.me/${encodeURIComponent(m.handle)}${a?"/"+fmt(a):""}`, amt:true },
  kofi:    { label:"Ko-fi",    letter:"K", color:"#29abe0", fg:"#fff", show:m=>"ko-fi.com/"+m.handle,
             url:m=> `https://ko-fi.com/${encodeURIComponent(m.handle)}` },
  zelle:   { label:"Zelle",    letter:"Z", color:"#6d1ed4", fg:"#fff", show:m=>m.handle, hint:"Send from your bank app" },
  applecash:{label:"Apple Cash",letter:"A", color:"#1c1c1e", fg:"#fff", show:m=>m.handle, hint:"Send from Messages or Wallet" },
  bitcoin: { label:"Bitcoin",  letter:"₿", color:"#f7931a", fg:"#2a1500", show:m=>m.address, crypto:"bitcoin", net:"BTC" },
  ethereum:{ label:"Ethereum", letter:"Ξ", color:"#627eea", fg:"#fff", show:m=>m.address, crypto:"ethereum", net:"ETH / ERC-20" },
  litecoin:{ label:"Litecoin", letter:"Ł", color:"#345d9d", fg:"#fff", show:m=>m.address, crypto:"litecoin", net:"LTC" },
  solana:  { label:"Solana",   letter:"◎", color:"#14f195", fg:"#062016", show:m=>m.address, crypto:"solana", net:"SOL" },
};

const ICON = {
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 18v3h-3"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
};

let amount = 0;
const fmt = a => Number.isInteger(a) ? String(a) : a.toFixed(2);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function resolve(m){
  const t = TYPES[m.type] || {};
  const value = m.value || (t.show ? t.show(m) : "");
  const copyText = m.address || m.copy || (m.type==="cashapp" ? "$"+m.handle : m.type==="venmo" ? "@"+m.handle : value);
  const url = m.url || (t.url ? t.url(m, amount) : "");
  const qrText = t.crypto ? `${t.crypto}:${m.address}` : (m.url || (t.url ? t.url(m, amount) : copyText));
  return { label:m.label||t.label||"Payment", letter:m.letter||t.letter||(m.label||"?")[0],
           color:m.color||t.color||"var(--accent)", fg:m.fg||t.fg||"#fff",
           value, copyText, url, qrText, amt:!!t.amt, hint:m.hint||t.hint||(t.net?`Send on ${t.net} only`:""), crypto:!!t.crypto };
}

function render(){
  $("#avatar").textContent = PROFILE.initials;
  $("#name").textContent = PROFILE.name;
  $("#note").textContent = PROFILE.note;
  $("#count").textContent = `${METHODS.length} way${METHODS.length===1?"":"s"} to pay`;
  $("#setup").hidden = !SHOW_SETUP_NOTE;
  const anyAmt = METHODS.some(m => TYPES[m.type]?.amt);
  $("#amount").hidden = !(anyAmt && AMOUNTS.length);
  $("#chips").innerHTML = AMOUNTS.map(a => `<button class="chip" type="button" data-amt="${a}" aria-pressed="${amount===a}">$${a}</button>`).join("");

  $("#grid").innerHTML = METHODS.map((m,i) => {
    const r = resolve(m);
    const openLabel = r.amt && amount ? `Pay $${fmt(amount)}` : "Open";
    return `<li class="card" data-i="${i}">
      <div class="top">
        <div class="badge" style="background:${esc(r.color)};color:${esc(r.fg)}" aria-hidden="true">${esc(r.letter)}</div>
        <div class="meta"><div class="name">${esc(r.label)}</div><div class="handle">${esc(r.value)}</div></div>
      </div>
      <div class="actions">
        ${r.url ? `<a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener">${openLabel} ${ICON.open}</a>` : ""}
        <button class="btn${r.url?"":" primary"}" type="button" data-act="copy">${ICON.copy}<span>Copy</span></button>
        <button class="btn icon" type="button" data-act="qr" aria-label="Show QR code for ${esc(r.label)}">${ICON.qr}</button>
      </div>
    </li>`;
  }).join("");
}

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1600);
}

function selectText(el){
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

$("#grid").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]"); if(!btn) return;
  const card = btn.closest(".card"); const r = resolve(METHODS[card.dataset.i]);
  if(btn.dataset.act === "copy"){
    const done = () => {
      btn.classList.add("done"); btn.innerHTML = ICON.check + "<span>Copied</span>";
      toast(`${r.label} copied`);
      setTimeout(()=>{ btn.classList.remove("done"); btn.innerHTML = ICON.copy + "<span>Copy</span>"; }, 1600);
    };
    const p = navigator.clipboard?.writeText(r.copyText);
    if(p) p.then(done).catch(()=>{ selectText(card.querySelector(".handle")); toast("Selected. Press copy on your device"); });
    else { selectText(card.querySelector(".handle")); toast("Selected. Press copy on your device"); }
  }
  if(btn.dataset.act === "qr") openQR(card.dataset.i);
});

let qrIndex = null, lastFocus = null;
function openQR(i){
  const r = resolve(METHODS[i]); qrIndex = i;
  if($("#sheet").hidden) lastFocus = document.activeElement;
  $("#sheetTitle").textContent = r.amt && amount ? `${r.label} · $${fmt(amount)}` : r.label;
  $("#sheetHandle").textContent = r.value;
  $("#sheetHint").textContent = r.hint || "Scan with your phone camera";
  const box = $("#qrBox"); box.innerHTML = "";
  if(window.QRCode){
    new QRCode(box, { text:r.qrText, width:200, height:200, colorDark:"#000000", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
  } else { box.style.lineHeight="1.4"; box.style.color="#000"; box.textContent = "QR unavailable"; }
  $("#sheet").hidden = false; $("#sheetClose").focus();
}
function closeQR(){ $("#sheet").hidden = true; qrIndex = null; lastFocus?.focus?.(); }
$("#sheetClose").addEventListener("click", closeQR);
$("#sheet").addEventListener("click", e => { if(e.target.id === "sheet") closeQR(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#sheet").hidden) closeQR(); });

function setAmount(a){
  amount = a > 0 ? Math.round(a*100)/100 : 0;
  render();
  try{
    const u = new URL(location.href);
    if(amount) u.searchParams.set("amount", fmt(amount)); else u.searchParams.delete("amount");
    history.replaceState(null, "", u);
  }catch(_){}
}
$("#amount").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  const a = Number(c.dataset.amt); $("#customAmt").value = "";
  setAmount(amount === a ? 0 : a);
});
$("#customAmt").addEventListener("input", e => {
  const v = parseFloat(e.target.value.replace(/[^0-9.]/g,""));
  amount = 0; setAmount(isNaN(v) ? 0 : v);
  const inp = $("#customAmt"); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
});

// Preset amount from the URL, e.g. ?amount=10.50
(() => {
  let q = null;
  try{ q = new URLSearchParams(location.search).get("amount"); }catch(_){}
  const v = q ? parseFloat(q.replace(/[^0-9.]/g,"")) : NaN;
  if(!isNaN(v) && v > 0){
    setAmount(v);
    if(!AMOUNTS.includes(amount)) $("#customAmt").value = fmt(amount);
  } else render();
})();
</script>

</body></html>
