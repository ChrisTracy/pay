<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pay Chris Tracy</title>
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1114" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/*
  Design: one narrow column. The amount is the hero, typed straight into the page.
  Methods are rows in a single list, not separate cards. Only apps that take an amount
  get the dark "Pay" button; everything else uses a quiet button. Colour comes from the
  app badges; green is reserved for "done" states.
*/
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#16181d; --muted:#646b77; --faint:#9aa0aa;
  --line:#e3e6ea; --soft:#eef0f3; --ok:#0e7a55; --on-ink:#ffffff;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#181b20; --ink:#eceef1; --muted:#9aa1ac; --faint:#6b727d;
  --line:#2a2f37; --soft:#22262d; --ok:#45c795; --on-ink:#0f1114; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#181b20; --ink:#eceef1; --muted:#9aa1ac; --faint:#6b727d;
  --line:#2a2f37; --soft:#22262d; --ok:#45c795; --on-ink:#0f1114; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a,button,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

.wrap{max-width:500px;margin:0 auto;
  padding:max(36px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(40px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* ---------- hero: who + amount ---------- */
.hero{text-align:center;padding:8px 0 28px}
h1{font:600 21px/1.2 var(--display);margin:0;letter-spacing:-.005em}
.photo{display:block;width:88px;height:88px;border-radius:50%;object-fit:cover;margin:0 auto 14px;background:var(--soft);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.note{margin:6px auto 0;color:var(--muted);max-width:36ch;text-wrap:pretty;font-size:15px}

.amt-field{display:inline-flex;align-items:flex-start;justify-content:center;margin:14px auto 0;cursor:text;
  font:700 clamp(56px,17vw,76px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  border-bottom:2px solid transparent;padding:0 4px 6px;transition:border-color .15s}
.amt-field:focus-within{border-color:var(--ink)}
.cur{font-size:.5em;line-height:1.25;color:var(--faint);margin-right:2px}
.amt-field.has .cur{color:var(--ink)}
#amt{font:inherit;letter-spacing:inherit;color:var(--ink);background:none;border:0;outline:none;padding:0;margin:0;
  width:1.3ch;min-width:1ch;text-align:left;font-variant-numeric:tabular-nums;caret-color:var(--ok)}
#amtMeasure{position:absolute;visibility:hidden;white-space:pre;font:inherit;letter-spacing:inherit;font-variant-numeric:tabular-nums}
.amt-field{position:relative}
#amt::placeholder{color:var(--faint);opacity:1}

.chips{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);
  font:500 15px/1 var(--body);font-variant-numeric:tabular-nums;min-height:44px;min-width:64px;padding:0 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.amt-hint{margin:14px auto 0;font-size:13.5px;color:var(--muted);max-width:34ch;text-wrap:balance}

/* ---------- method lists ---------- */
.group-label{font:600 13.5px/1 var(--body);color:var(--muted);margin:28px 4px 10px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:center;padding:14px 14px 10px 16px}
.row + .row{border-top:1px solid var(--line)}
.badge{grid-row:1 / span 2;align-self:start;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  font:700 18px/1 var(--display)}
.meta{min-width:0}
.name{font-weight:600;line-height:1.25}
.handle{font-size:14px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35;user-select:all}
.handle.addr{font-family:var(--mono);font-size:13px;letter-spacing:-.01em}
.net{font-size:12.5px;color:var(--faint);margin-top:1px}

.main{grid-column:3;grid-row:1;appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:0 16px;border-radius:12px;font:600 15px/1 var(--body);text-decoration:none;white-space:nowrap;cursor:pointer;
  border:1px solid var(--line);background:var(--soft);color:var(--ink);font-variant-numeric:tabular-nums}
.main.pay{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.main svg{width:16px;height:16px}

.more{grid-column:2 / 4;display:flex;gap:4px;margin-left:-8px}
.ghost{appearance:none;border:0;background:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 8px;
  border-radius:8px;font:500 13.5px/1 var(--body);color:var(--muted);cursor:pointer}
.ghost svg{width:16px;height:16px}
.ghost:hover{background:var(--soft);color:var(--ink)}
.ghost.done{color:var(--ok)}

.main:hover{filter:brightness(1.08)}
.main:focus-visible,.ghost:focus-visible,.chip:focus-visible,.sheet .main:focus-visible{outline:2px solid var(--ok);outline-offset:2px}

.foot{font-size:13px;color:var(--muted);text-align:center;margin:28px auto 0;max-width:34ch;text-wrap:balance}

/* very narrow: fold cover screens */
@media (max-width:360px){
  .photo{width:76px;height:76px;margin-bottom:12px}
  .wrap{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:24px}
  .row{grid-template-columns:36px minmax(0,1fr);padding:12px}
  .badge{width:36px;height:36px;border-radius:10px;font-size:16px}
  .main{grid-column:1 / -1;grid-row:auto;margin-top:10px}
  .more{grid-column:1 / -1;justify-content:center;margin-left:0}
  .chip{min-width:52px;padding:0 10px}
}

/* ---------- QR sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:safe center;overflow:auto;
  background:color-mix(in srgb,#000 50%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{background:var(--surface);border-radius:22px;padding:22px;width:min(100%,320px);
  display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.sheet-title{font:700 20px/1.2 var(--display)}
.sheet-handle{font-size:13px;color:var(--muted);overflow-wrap:anywhere;max-width:100%}
.sheet-handle.addr{font-family:var(--mono)}
.qr-box{background:#fff;padding:12px;border-radius:14px;line-height:0}
.qr-box img,.qr-box canvas{width:200px;height:200px;max-width:100%}
.sheet small{font-size:13px;color:var(--muted)}
.sheet .main{width:100%}
@media (max-height:480px){
  .sheet-card{padding:14px;gap:8px}
  .qr-box img,.qr-box canvas{width:150px;height:150px}
}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);
  background:var(--ink);color:var(--on-ink);font:600 14px var(--body);padding:10px 16px;border-radius:999px;opacity:0;
  transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.amt-field{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <img class="photo" id="photo" alt="" width="88" height="88" hidden>
    <h1 id="title"></h1>
    <p class="note" id="note" hidden></p>
    <div id="amountBlock" hidden>
      <label class="amt-field" id="amtField" for="amt">
        <span class="cur" aria-hidden="true">$</span>
        <span id="amtMeasure" aria-hidden="true"></span>
        <input id="amt" inputmode="decimal" placeholder="0" autocomplete="off" maxlength="8" aria-label="Amount in dollars">
      </label>
      <div class="chips" id="chips"></div>
      <p class="amt-hint" id="amtHint"></p>
    </div>
  </section>

  <div id="lists"></div>

  <p class="foot">Check the name or address before you send. Payments can't be reversed.</p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="qr-box" id="qrBox"></div>
    <div class="sheet-handle" id="sheetHandle"></div>
    <small id="sheetHint"></small>
    <button class="main" type="button" id="sheetClose">Close</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ============ EDIT THIS ============ */
const PROFILE = {
  name: "Chris Tracy",
  note: "",            // optional line under your name; leave "" for none
  photo: "me.jpg",     // square photo in this folder; leave "" for none
};

// Quick-pick amounts in dollars. Use [] to hide the amount.
const AMOUNTS = [5, 10, 20, 50];

// Add, remove or reorder. Crypto goes in its own section automatically.
// Built-in types: venmo, cashapp, paypal, kofi, zelle, applecash, bitcoin, ethereum, litecoin, solana
// Custom: { label:"Ko-fi", value:"ko-fi.com/you", url:"https://ko-fi.com/you", color:"#29abe0", letter:"K" }
const METHODS = [
  { type: "venmo",    handle: "christracy" },
  //{ type: "cashapp",  handle: "" },
  { type: "paypal",   handle: "cstracy" },
  { type: "kofi",     handle: "ctracy" },
  { type: "bitcoin",  address: "bc1qevdglv9u656apdpg0sqhzhlws4p8qk8n6q7hk7" },
  { type: "ethereum", address: "0x387De24E6A13769170A88A9A2406475c6791b0Aa" },
];
/* =================================== */

const TYPES = {
  venmo:   { label:"Venmo",    letter:"V", color:"#008cff", fg:"#fff", show:m=>"@"+m.handle,
             url:(m,a)=> a ? `https://venmo.com/?txn=pay&recipients=${encodeURIComponent(m.handle)}&amount=${fmt(a)}` : `https://venmo.com/u/${encodeURIComponent(m.handle)}`, amt:true },
  cashapp: { label:"Cash App", letter:"$", color:"#00d64f", fg:"#05210f", show:m=>"$"+m.handle,
             url:(m,a)=> `https://cash.app/$${encodeURIComponent(m.handle)}${a?"/"+fmt(a):""}`, amt:true },
  paypal:  { label:"PayPal",   letter:"P", color:"#0b2f8a", fg:"#fff", show:m=>"paypal.me/"+m.handle,
             url:(m,a)=> `https://paypal.me/${encodeURIComponent(m.handle)}${a?"/"+fmt(a):""}`, amt:true },
  kofi:    { label:"Ko-fi",    letter:"K", color:"#29abe0", fg:"#fff", show:m=>"ko-fi.com/"+m.handle,
             url:m=> `https://ko-fi.com/${encodeURIComponent(m.handle)}` },
  zelle:   { label:"Zelle",    letter:"Z", color:"#6d1ed4", fg:"#fff", show:m=>m.handle, hint:"Send from your bank app" },
  applecash:{label:"Apple Cash",letter:"A", color:"#1c1c1e", fg:"#fff", show:m=>m.handle, hint:"Send from Messages or Wallet" },
  bitcoin: { label:"Bitcoin",  letter:"₿", color:"#f7931a", fg:"#2a1500", show:m=>m.address, crypto:"bitcoin", net:"Bitcoin" },
  ethereum:{ label:"Ethereum", letter:"Ξ", color:"#627eea", fg:"#fff", show:m=>m.address, crypto:"ethereum", net:"Ethereum" },
  litecoin:{ label:"Litecoin", letter:"Ł", color:"#345d9d", fg:"#fff", show:m=>m.address, crypto:"litecoin", net:"Litecoin" },
  solana:  { label:"Solana",   letter:"◎", color:"#14f195", fg:"#062016", show:m=>m.address, crypto:"solana", net:"Solana" },
};

const ICON = {
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  qr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 18v3h-3"/></svg>',
  open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
};

let amount = 0;
const fmt = a => Number.isInteger(a) ? String(a) : a.toFixed(2);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short = a => a.length > 22 ? a.slice(0, 10) + "…" + a.slice(-8) : a;
const joinList = xs => xs.length < 3 ? xs.join(" and ") : xs.slice(0,-1).join(", ") + " and " + xs.at(-1);

function resolve(m){
  const t = TYPES[m.type] || {};
  const value = m.value || (t.show ? t.show(m) : "");
  const copyText = m.address || m.copy || value;
  const url = m.url || (t.url ? t.url(m, amount) : "");
  const qrText = t.crypto ? `${t.crypto}:${m.address}` : (url || copyText);
  return { label:m.label||t.label||"Payment", letter:m.letter||t.letter||(m.label||"?")[0],
           color:m.color||t.color||"var(--ink)", fg:m.fg||t.fg||"#fff",
           value, copyText, url, qrText, amt:!!t.amt, crypto:!!t.crypto,
           hint:m.hint||t.hint||(t.net?`${t.net} network only`:"") };
}

const amtApps = METHODS.filter(m => TYPES[m.type]?.amt).map(m => TYPES[m.type].label);

function rowHTML(m, i){
  const r = resolve(m);
  const shown = r.crypto ? short(r.value) : r.value;
  let main = "";
  if(r.url && r.amt) main = `<a class="main pay" href="${esc(r.url)}" target="_blank" rel="noopener">${amount ? `Pay $${fmt(amount)}` : "Pay"}</a>`;
  else if(r.url)     main = `<a class="main" href="${esc(r.url)}" target="_blank" rel="noopener">Open ${ICON.open}</a>`;
  else               main = `<button class="main" type="button" data-act="copy" data-i="${i}">Copy</button>`;
  const copyGhost = r.url ? `<button class="ghost" type="button" data-act="copy" data-i="${i}">${ICON.copy}<span>Copy</span></button>` : "";
  return `<li class="row">
    <span class="badge" style="background:${esc(r.color)};color:${esc(r.fg)}" aria-hidden="true">${esc(r.letter)}</span>
    <div class="meta">
      <div class="name">${esc(r.label)}</div>
      <div class="handle${r.crypto ? " addr" : ""}" title="${esc(r.value)}">${esc(shown)}</div>
      ${r.crypto || r.hint ? `<div class="net">${esc(r.hint)}</div>` : ""}
    </div>
    ${main}
    <div class="more">${copyGhost}<button class="ghost" type="button" data-act="qr" data-i="${i}">${ICON.qr}<span>QR code</span></button></div>
  </li>`;
}

function renderLists(){
  const apps = [], crypto = [];
  METHODS.forEach((m, i) => (TYPES[m.type]?.crypto ? crypto : apps).push(rowHTML(m, i)));
  $("#lists").innerHTML =
    (apps.length ? `<ul class="list" aria-label="Payment apps">${apps.join("")}</ul>` : "") +
    (crypto.length ? `<h2 class="group-label">Crypto</h2><ul class="list">${crypto.join("")}</ul>` : "");
}

function renderChips(){
  $("#chips").innerHTML = AMOUNTS.map(a =>
    `<button class="chip" type="button" data-amt="${a}" aria-pressed="${amount===a}">$${a}</button>`).join("");
}

function sizeInput(){
  const inp = $("#amt");
  const m = $("#amtMeasure");
  m.textContent = inp.value || inp.placeholder;
  inp.style.width = Math.ceil(m.getBoundingClientRect().width) + 3 + "px";
  $("#amtField").classList.toggle("has", !!inp.value);
}

function setAmount(a, {fromInput=false} = {}){
  amount = a > 0 ? Math.round(a*100)/100 : 0;
  if(!fromInput){ $("#amt").value = amount ? fmt(amount) : ""; }
  sizeInput(); renderChips(); renderLists();
  $("#amtHint").textContent = amount
    ? `${joinList(amtApps)} will open with $${fmt(amount)} filled in.`
    : `Optional. ${joinList(amtApps)} will open with it filled in.`;
  try{
    const u = new URL(location.href);
    if(amount) u.searchParams.set("amount", fmt(amount)); else u.searchParams.delete("amount");
    history.replaceState(null, "", u);
  }catch(_){}
}

/* ---------- events ---------- */
$("#amt").addEventListener("input", e => {
  const inp = e.target;
  let v = inp.value.replace(/[^\d.]/g, "");
  const dot = v.indexOf(".");
  if(dot !== -1) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, "").slice(0, 2);
  if(v !== inp.value) inp.value = v;
  const n = parseFloat(v);
  setAmount(isNaN(n) ? 0 : n, {fromInput:true});
});
$("#chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if(!c) return;
  const a = Number(c.dataset.amt);
  setAmount(amount === a ? 0 : a);
});

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 1600);
}
function selectText(el){
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

$("#lists").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]"); if(!btn) return;
  const i = btn.dataset.i, r = resolve(METHODS[i]);
  if(btn.dataset.act === "qr") return openQR(i);
  const what = r.crypto ? "address" : "handle";
  const label = btn.querySelector("span") || btn;
  const before = label.textContent;
  const done = () => {
    btn.classList.add("done"); label.textContent = "Copied";
    toast(`${r.label} ${what} copied`);
    setTimeout(()=>{ btn.classList.remove("done"); label.textContent = before; }, 1600);
  };
  const fail = () => { selectText(btn.closest(".row").querySelector(".handle")); toast("Couldn't copy. Select and copy it yourself"); };
  const p = navigator.clipboard?.writeText(r.copyText);
  p ? p.then(done).catch(fail) : fail();
});

let lastFocus = null;
function openQR(i){
  const r = resolve(METHODS[i]);
  if($("#sheet").hidden) lastFocus = document.activeElement;
  $("#sheetTitle").textContent = r.amt && amount ? `${r.label}, $${fmt(amount)}` : r.label;
  const h = $("#sheetHandle"); h.textContent = r.value; h.classList.toggle("addr", r.crypto);
  $("#sheetHint").textContent = r.hint || "Scan with a phone camera";
  const box = $("#qrBox"); box.innerHTML = "";
  if(window.QRCode){
    new QRCode(box, { text:r.qrText, width:200, height:200, colorDark:"#000000", colorLight:"#ffffff", correctLevel:QRCode.CorrectLevel.M });
  } else { box.style.lineHeight="1.4"; box.style.color="#000"; box.textContent = "QR code couldn't load"; }
  $("#sheet").hidden = false; $("#sheetClose").focus();
}
function closeQR(){ $("#sheet").hidden = true; lastFocus?.focus?.(); }
$("#sheetClose").addEventListener("click", closeQR);
$("#sheet").addEventListener("click", e => { if(e.target.id === "sheet") closeQR(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#sheet").hidden) closeQR(); });

/* ---------- start ---------- */
$("#title").textContent = `Pay ${PROFILE.name}`;
document.title = `Pay ${PROFILE.name}`;
if(PROFILE.photo){
  const img = $("#photo");
  img.onload = () => { img.hidden = false; };
  img.onerror = () => { img.hidden = true; };
  img.alt = PROFILE.name;
  img.src = PROFILE.photo;
}
if(PROFILE.note){ $("#note").textContent = PROFILE.note; $("#note").hidden = false; }
$("#amountBlock").hidden = !(amtApps.length && AMOUNTS.length);

let q = null;
try{ q = new URLSearchParams(location.search).get("amount"); }catch(_){}
const start = q ? parseFloat(q.replace(/[^0-9.]/g,"")) : NaN;
setAmount(!isNaN(start) && start > 0 ? start : 0);
document.fonts?.ready.then(sizeInput);
</script>
</body>
</html>
